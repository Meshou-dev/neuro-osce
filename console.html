<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSCE — Examiner Console (private)</title>
<link rel="stylesheet" href="osce.css">
<style>
  #tt{font-size:20px;min-width:74px}
  .showgrid{display:flex;gap:8px;flex-wrap:wrap}
  .dx{font-size:12px;color:var(--accent);font-weight:700;margin:2px 0 0}
  .domain-h{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}
  .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .item .q{font-size:14.5px;font-weight:700}
  .item .model{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.55}
  .sc{display:flex;gap:6px;margin-top:9px}
  .sc button{width:38px;height:34px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink-faint);font-family:inherit}
  .sc button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .sc button.on0{background:var(--ink-faint);border-color:var(--ink-faint);color:#fff}
  .totalbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-top:12px}
  .totalbar .v{font-size:16px;font-weight:800}
  .band{font-size:12px;font-weight:800;padding:3px 11px;border-radius:20px}
  .b-cf{background:var(--danger-bg);color:var(--danger)} .b-bf{background:#f6ede0;color:var(--warn)}
  .b-bp{background:#eef4ee;color:var(--ok)} .b-cp{background:var(--ok-bg);color:var(--ok)}
  .grating{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .grating label{border:1px solid var(--line-strong);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
  .grating input{display:none}.grating input:checked + span{}
  .grating label.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--ink-faint)}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><h1>Examiner console</h1><p>Private — do not screen-share this window</p></div>
  <nav class="nav" id="nav"></nav>
  <div class="spacer"></div>
  <div class="timerbox" id="tbox"><span class="t" id="tt">10:00</span><button class="btn" id="startbtn">Start</button><button class="btn" id="resetbtn">Reset</button></div>
  <button class="btn accent" id="opendisp">Open Display</button>
</div></header>

<main style="max-width:1000px;margin:0 auto;padding:20px 20px 70px">
  <div class="card">
    <div class="kicker">Show to candidate <span class="hint" id="dxline"></span></div>
    <p class="hint" style="margin:0 0 10px">Click to push each item to the shared Display. Click again to hide it.</p>
    <div class="showgrid" id="showbox"></div>
    <div style="margin-top:12px"><button class="btn" id="clearbtn">Clear display</button></div>
  </div>

  <div class="card">
    <div class="kicker">Examinee assessment · 2 = done · 1 = partial · 0 = not done</div>
    <div id="rubricbox"></div>
    <div class="totalbar"><span class="v"><span id="total">0</span> / <span id="max">0</span> (<span id="pct">0</span>%)</span><span class="band b-cf" id="band">Clear Fail</span></div>
    <div style="margin-top:14px"><div class="hint" style="font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Global rating</div>
      <div class="grating" id="global"></div></div>
  </div>
</main>

<script src="osce-data.js"></script>
<script>
(function(){
  var stations=window.OSCE.stations, byId={}; stations.forEach(function(s){byId[s.id]=s;});
  var S={station:stations[0].id, timer:{remaining:600,running:false}, revealed:{}, scores:{}, global:{}};
  function cur(){return byId[S.station];}
  function revArr(){return S.revealed[S.station]||(S.revealed[S.station]=[]);}
  function itemCount(s){var n=0;s.domains.forEach(function(d){n+=d.items.length;});return n;}
  function scoreArr(){var s=cur();if(!S.scores[S.station])S.scores[S.station]=new Array(itemCount(s)).fill(-1);return S.scores[S.station];}

  var bc=('BroadcastChannel' in window)? new BroadcastChannel('osce') : null;
  function send(){var m={t:'state',station:S.station,timer:S.timer,revealed:revArr()}; if(bc)bc.postMessage(m); try{localStorage.setItem('osce-msg',JSON.stringify({t:'state',station:S.station,timer:S.timer,revealed:revArr(),_:(+new Date())}));}catch(x){}}
  if(bc) bc.onmessage=function(e){ if(e.data&&e.data.t==='hello') send(); };
  window.addEventListener('storage',function(e){ if(e.key==='osce-msg'&&e.newValue){ try{var d=JSON.parse(e.newValue); if(d.t==='hello') send();}catch(x){} } });

  var tick=null;
  function renderTimer(){var r=S.timer.remaining,m=Math.floor(r/60),s=r%60;document.getElementById('tt').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;document.getElementById('tbox').classList.toggle('warn',r<=120);document.getElementById('startbtn').textContent=S.timer.running?'Pause':'Start';}
  document.getElementById('startbtn').onclick=function(){
    if(S.timer.running){S.timer.running=false;if(tick){clearInterval(tick);tick=null;}renderTimer();send();return;}
    if(S.timer.remaining<=0)S.timer.remaining=600; S.timer.running=true;
    tick=setInterval(function(){S.timer.remaining--;if(S.timer.remaining<=0){S.timer.remaining=0;S.timer.running=false;clearInterval(tick);tick=null;}renderTimer();send();},1000);
    renderTimer();send();
  };
  document.getElementById('resetbtn').onclick=function(){if(tick){clearInterval(tick);tick=null;}S.timer.running=false;S.timer.remaining=600;renderTimer();send();};
  document.getElementById('clearbtn').onclick=function(){S.revealed[S.station]=[];renderShow();send();};
  document.getElementById('opendisp').onclick=function(){window.open('display.html','osceDisplay');setTimeout(send,800);};

  function renderNav(){
    var n=document.getElementById('nav'); n.innerHTML='';
    stations.forEach(function(s){var b=document.createElement('button');b.className='pill'+(s.id===S.station?' active':'');b.textContent=s.n;b.onclick=function(){setStation(s.id);};n.appendChild(b);});
  }
  function setStation(id){S.station=id;if(tick){clearInterval(tick);tick=null;}S.timer={remaining:600,running:false};renderAll();send();}

  function renderShow(){
    document.getElementById('dxline').textContent='· '+cur().dx;
    var box=document.getElementById('showbox'); box.innerHTML='';
    var a=revArr();
    (cur().show||[]).forEach(function(it){
      var b=document.createElement('button'); b.className='btn'+(a.indexOf(it.id)>=0?' on':''); b.textContent=it.label;
      b.onclick=function(){var arr=revArr();var i=arr.indexOf(it.id);if(i>=0)arr.splice(i,1);else arr.push(it.id);renderShow();send();};
      box.appendChild(b);
    });
  }

  function computeTotal(){
    var s=cur(), arr=scoreArr(), earned=0, max=0, idx=0;
    s.domains.forEach(function(d){ d.items.forEach(function(it){ max+=it.max; if(arr[idx]>=0)earned+=arr[idx]; idx++; }); });
    var pct=max?Math.round(earned/max*100):0;
    document.getElementById('total').textContent=earned;
    document.getElementById('max').textContent=max;
    document.getElementById('pct').textContent=pct;
    var band=document.getElementById('band'), lab, cls;
    if(pct>=70){lab='Clear Pass';cls='b-cp';} else if(pct>=60){lab='Borderline Pass';cls='b-bp';} else if(pct>=50){lab='Borderline Fail';cls='b-bf';} else {lab='Clear Fail';cls='b-cf';}
    band.textContent=lab; band.className='band '+cls;
  }
  function renderRubric(){
    var s=cur(), arr=scoreArr(), box=document.getElementById('rubricbox'); box.innerHTML=''; var idx=0;
    s.domains.forEach(function(d){
      var h=document.createElement('div'); h.className='domain-h'; h.textContent=d.name; box.appendChild(h);
      d.items.forEach(function(it){
        var myIdx=idx;
        var wrap=document.createElement('div'); wrap.className='item';
        wrap.innerHTML='<div class="q">'+it.q+'</div><div class="model"><b>Model:</b> '+it.model+'</div>';
        var sc=document.createElement('div'); sc.className='sc';
        [2,1,0].forEach(function(v){
          var b=document.createElement('button'); b.textContent=v;
          if(arr[myIdx]===v) b.className=(v===0?'on0':'on');
          b.onclick=function(){arr[myIdx]=v;renderRubric();computeTotal();};
          sc.appendChild(b);
        });
        wrap.appendChild(sc); box.appendChild(wrap); idx++;
      });
    });
    computeTotal();
  }
  function renderGlobal(){
    var g=document.getElementById('global'); g.innerHTML=''; var opts=['Clear Fail','Borderline Fail','Borderline Pass','Clear Pass'];
    opts.forEach(function(o){
      var lab=document.createElement('label'); lab.textContent=o; if(S.global[S.station]===o)lab.className='on';
      lab.onclick=function(){S.global[S.station]=o;renderGlobal();};
      g.appendChild(lab);
    });
  }
  function renderAll(){renderNav();renderTimer();renderShow();renderRubric();renderGlobal();}
  renderAll(); send();
})();
</script>
</body>
</html>
